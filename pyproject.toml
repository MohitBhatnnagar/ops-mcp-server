[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-mcp-server"
version = "0.1.0"
description = "Model Context Protocol server exposing operations tools (KPIs, capacity, runbook search, approval requests) to AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
opsmcp = "opsmcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
